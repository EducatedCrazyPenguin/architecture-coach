[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "architecture-coach"
version = "0.1.0"
description = "A local, source-backed architecture learning coach for your projects"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[project.scripts]
archcoach = "archcoach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/archcoach"]
artifacts = ["vendor/archify/**", "node_modules/htmx.org/dist/htmx.min.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
