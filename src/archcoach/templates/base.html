<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="archcoach-token" content="{{ csrf_token }}">
  <title>{% block title %}Architecture Coach{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/settings.css') }}">
  <script src="/vendor/htmx.min.js" defer></script>
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/"><span class="brand-mark">A</span><span>Architecture<br>Coach</span></a>
      <nav>
        <a class="nav-link {{ 'active' if page == 'projects' else '' }}" href="/">All projects</a>
        {% for item in projects %}
          <a class="project-link {{ 'active' if project and item.id == project.id else '' }}" href="/projects/{{ item.id }}">
            <span class="status-dot {{ 'ready' if item.latest_review else '' }}"></span>
            <span><b>{{ item.name }}</b><small>{{ item.next_review }}</small></span>
          </a>
        {% endfor %}
        <a class="nav-link {{ 'active' if page == 'settings' else '' }}" href="/settings">Settings</a>
      </nav>
      <form class="exit-form" method="post" action="/exit?token={{ csrf_token }}"><button class="quiet" type="submit">Exit app</button></form>
    </aside>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
